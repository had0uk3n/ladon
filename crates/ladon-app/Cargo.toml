[package]
name = "ladon-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "ladon-app"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:arboard", "dep:eframe"]

[dependencies]
argon2.workspace = true
arboard = { version = "3.6.1", optional = true }
eframe = { version = "=0.32.3", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
getrandom.workspace = true
ladon-core = { path = "../ladon-core" }
subtle.workspace = true
tempfile = "3"
uuid.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.1"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSError", "NSString", "std"] }
objc2-local-authentication = { version = "0.3.2", default-features = false, features = ["LAContext", "block2", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
